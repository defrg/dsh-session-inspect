# pnpm 项目级设置（pnpm 10+ 从这里读取，.npmrc 里的同名项已不再生效）。
#
# 关掉「自动安装缺失的 peer 依赖」：
#   @deepseek-ai/cordis 与 @deepseek-ai/dsh 是**宿主运行时提供**的 peerDependency，
#   插件自己不需要、也不应该有它们。pnpm 默认会把缺失的 peer 自动装进来，于是在插件
#   目录里拖下一整条 dsh 依赖树（实测 529 个包 / 453 MB）；关掉后只剩 dependencies 里
#   真正需要的 @deepseek-ai/schemastery（43 个文件 / 0.2 MB）。
autoInstallPeers: false

# store 固定放在项目内（与 node_modules 同级），不污染盘根，用**相对路径**。
#
# 实测（`pnpm store path`）：相对写法 `.pnpm-store` 与 `./.pnpm-store` 都正确解析为
# <本仓库>\.pnpm-store，因此这里不留本机绝对路径 —— 另一台机器的工作区在别处，
# 写死 E:/... 会指到不存在的盘。约定见 dsh-capabilities 的 instructions/shared.md。
storeDir: .pnpm-store
